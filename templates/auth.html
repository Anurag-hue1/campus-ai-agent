<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus AI Agent - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Authentication Box -->
  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6 relative overflow-hidden backdrop-blur-xl">
    
    <!-- Header / Branding -->
    <div class="text-center space-y-2">
      <div id="portalIconBg" class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/30 transition-all duration-300">
        <i id="portalIcon" class="fa-solid fa-graduation-cap text-white text-2xl"></i>
      </div>
      <h1 id="portalTitle" class="text-2xl font-bold text-white tracking-tight">Student Login</h1>
      <p id="portalSubtitle" class="text-xs text-slate-400">Enter your Roll Number / User ID to access your academic board</p>
    </div>

    <!-- Dynamic Alert Box -->
    <div id="authAlert" class="hidden p-3 rounded-xl text-xs font-medium border flex items-center gap-2"></div>

    <!-- Auth Form -->
    <form id="loginForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
      
      <!-- Full Name (Only when creating account) -->
      <div id="nameFieldGroup" class="hidden space-y-1">
        <label class="block text-xs font-semibold text-slate-300">Full Name <span class="text-rose-400">*</span></label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          <input type="text" id="authFullName" placeholder="e.g. Anurag Verma" 
                 class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" />
        </div>
      </div>

      <!-- User ID / Roll Number -->
      <div class="space-y-1">
        <label id="userIdLabel" class="block text-xs font-semibold text-slate-300">User ID / Roll Number <span class="text-rose-400">*</span></label>
        <div class="relative">
          <i id="userIdIcon" class="fa-solid fa-id-badge absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          <input type="text" id="authUserId" required placeholder="e.g. 22B91A0501 or user1" autocomplete="username"
                 class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" />
        </div>
      </div>

      <!-- Password -->
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-slate-300">Password <span class="text-rose-400">*</span></label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          <input type="password" id="authPassword" required placeholder="Enter password (min 6 chars)" autocomplete="current-password"
                 class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" />
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="authSubmitBtn" 
              class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-xs font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30">
        Login to Dashboard
      </button>
    </form>

    <!-- Switch Between Login & Create Account -->
    <div id="studentToggleGroup" class="text-center text-xs text-slate-400 pt-1 border-t border-slate-800/80">
      <span id="switchPrompt">Don't have an account?</span>
      <button type="button" onclick="toggleRegisterMode()" id="switchBtn" class="text-indigo-400 font-semibold hover:underline ml-1">Create Account</button>
    </div>

    <!-- Admin Portal Toggle Link -->
    <div class="text-center pt-1">
      <button type="button" onclick="toggleAdminMode()" id="adminToggleBtn" 
              class="text-xs text-slate-400 hover:text-amber-400 transition flex items-center justify-center gap-1.5 mx-auto font-medium">
        <i id="adminToggleIcon" class="fa-solid fa-shield-halved text-amber-500"></i>
        <span id="adminToggleText">Go to Admin Portal</span>
      </button>
    </div>

  </div>

  <script>
    let isRegisterMode = false;
    let isAdminMode = false;

    function showAlert(msg, isError = true) {
      const alert = document.getElementById('authAlert');
      alert.classList.remove('hidden', 'bg-rose-950/60', 'border-rose-800', 'text-rose-300', 'bg-emerald-950/60', 'border-emerald-800', 'text-emerald-300');
      if (isError) {
        alert.classList.add('bg-rose-950/60', 'border-rose-800', 'text-rose-300');
        alert.innerHTML = `<i class="fa-solid fa-circle-exclamation text-rose-400"></i><span>${msg}</span>`;
      } else {
        alert.classList.add('bg-emerald-950/60', 'border-emerald-800', 'text-emerald-300');
        alert.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>${msg}</span>`;
      }
    }

    function toggleRegisterMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('authAlert').classList.add('hidden');
      
      const nameGroup = document.getElementById('nameFieldGroup');
      const submitBtn = document.getElementById('authSubmitBtn');
      const title = document.getElementById('portalTitle');
      const subtitle = document.getElementById('portalSubtitle');
      const switchPrompt = document.getElementById('switchPrompt');
      const switchBtn = document.getElementById('switchBtn');

      if (isRegisterMode) {
        nameGroup.classList.remove('hidden');
        title.innerText = 'Create Account';
        subtitle.innerText = 'Choose a User ID / Roll Number and Password to register';
        submitBtn.innerText = 'Create Account';
        switchPrompt.innerText = 'Already have an account?';
        switchBtn.innerText = 'Login';
      } else {
        nameGroup.classList.add('hidden');
        title.innerText = 'Student Login';
        subtitle.innerText = 'Enter your Roll Number / User ID to access your academic board';
        submitBtn.innerText = 'Login to Dashboard';
        switchPrompt.innerText = "Don't have an account?";
        switchBtn.innerText = 'Create Account';
      }
    }

    function toggleAdminMode() {
      isAdminMode = !isAdminMode;
      document.getElementById('authAlert').classList.add('hidden');
      
      // Clear fields
      document.getElementById('authUserId').value = '';
      document.getElementById('authPassword').value = '';
      document.getElementById('authFullName').value = '';

      const iconBg = document.getElementById('portalIconBg');
      const icon = document.getElementById('portalIcon');
      const title = document.getElementById('portalTitle');
      const subtitle = document.getElementById('portalSubtitle');
      const submitBtn = document.getElementById('authSubmitBtn');
      const studentToggle = document.getElementById('studentToggleGroup');
      const adminToggleText = document.getElementById('adminToggleText');
      const adminToggleIcon = document.getElementById('adminToggleIcon');
      const nameGroup = document.getElementById('nameFieldGroup');
      const userInput = document.getElementById('authUserId');
      const userIdLabel = document.getElementById('userIdLabel');
      const userIdIcon = document.getElementById('userIdIcon');

      if (isAdminMode) {
        isRegisterMode = false;
        nameGroup.classList.add('hidden');
        studentToggle.classList.add('hidden');

        iconBg.className = 'w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-amber-600 to-rose-600 flex items-center justify-center shadow-lg shadow-amber-500/30 transition-all duration-300';
        icon.className = 'fa-solid fa-shield-halved text-white text-2xl';
        title.innerText = 'Admin Portal';
        subtitle.innerText = 'Restricted Administrator Control Access';
        submitBtn.className = 'w-full bg-gradient-to-r from-amber-600 to-rose-600 hover:from-amber-500 hover:to-rose-500 text-white text-xs font-bold py-3 rounded-xl transition shadow-lg shadow-amber-600/30';
        submitBtn.innerText = 'Authenticate as Administrator';

        userIdLabel.innerHTML = 'Admin User ID <span class="text-rose-400">*</span>';
        userIdIcon.className = 'fa-solid fa-user-shield absolute left-3.5 top-3 text-slate-500 text-xs';
        userInput.placeholder = 'Enter Admin ID (default: admin)';

        adminToggleText.innerText = 'Switch to Student Login';
        adminToggleIcon.className = 'fa-solid fa-graduation-cap text-indigo-400';
      } else {
        studentToggle.classList.remove('hidden');

        iconBg.className = 'w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/30 transition-all duration-300';
        icon.className = 'fa-solid fa-graduation-cap text-white text-2xl';
        title.innerText = 'Student Login';
        subtitle.innerText = 'Enter your Roll Number / User ID to access your academic board';
        submitBtn.className = 'w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-xs font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30';
        submitBtn.innerText = 'Login to Dashboard';

        userIdLabel.innerHTML = 'User ID / Roll Number <span class="text-rose-400">*</span>';
        userIdIcon.className = 'fa-solid fa-id-badge absolute left-3.5 top-3 text-slate-500 text-xs';
        userInput.placeholder = 'e.g. 22B91A0501 or user1';

        adminToggleText.innerText = 'Go to Admin Portal';
        adminToggleIcon.className = 'fa-solid fa-shield-halved text-amber-500';
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const user_id = document.getElementById('authUserId').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const fullName = document.getElementById('authFullName').value.trim();

      if (!user_id || !password || (isRegisterMode && !fullName)) {
        showAlert('Please fill in all required fields.');
        return;
      }

      const submitBtn = document.getElementById('authSubmitBtn');
      submitBtn.disabled = true;
      const originalText = submitBtn.innerText;
      submitBtn.innerText = 'Verifying credentials...';

      const endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
      const payload = isRegisterMode ? { user_id, password, full_name: fullName } : { user_id, password };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showAlert('Authenticated successfully! Redirecting...', false);
          setTimeout(() => {
            window.location.href = data.redirect || '/';
          }, 600);
        } else {
          showAlert(data.error || 'Authentication failed.');
        }
      } catch (err) {
        showAlert('Network error: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;
      }
    }
  </script>
</body>
</html>
