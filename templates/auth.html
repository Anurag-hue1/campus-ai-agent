<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus AI Agent - Authentication</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Authentication Card -->
  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6 relative overflow-hidden backdrop-blur-xl">
    
    <!-- Header / Branding -->
    <div class="text-center space-y-2">
      <div id="portalIconBg" class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/30 transition-all duration-300">
        <i id="portalIcon" class="fa-solid fa-graduation-cap text-white text-2xl"></i>
      </div>
      <h1 id="portalTitle" class="text-2xl font-bold text-white tracking-tight">Student Login</h1>
      <p id="portalSubtitle" class="text-xs text-slate-400">Enter your university credentials to access your academic dashboard</p>
    </div>

    <!-- Error / Success Alert Box -->
    <div id="authAlert" class="hidden p-3 rounded-xl text-xs font-medium border flex items-center gap-2"></div>

    <!-- Login Form (Student & Admin) -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div id="nameFieldGroup" class="hidden space-y-1">
        <label class="block text-xs font-semibold text-slate-300">Full Name <span class="text-rose-400">*</span></label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          <input type="text" id="authFullName" placeholder="e.g. Anurag Verma" 
                 class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" />
        </div>
      </div>

      <div class="space-y-1">
        <label id="emailLabel" class="block text-xs font-semibold text-slate-300">Email Address <span class="text-rose-400">*</span></label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          <input type="email" id="authEmail" required placeholder="Enter your email address" autocomplete="email"
                 class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" />
        </div>
      </div>

      <div class="space-y-1">
        <div class="flex items-center justify-between">
          <label class="block text-xs font-semibold text-slate-300">Password <span class="text-rose-400">*</span></label>
          <button type="button" id="forgotPwLink" onclick="openForgotModal()" class="text-[11px] text-indigo-400 hover:underline">Forgot Password?</button>
        </div>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          <input type="password" id="authPassword" required placeholder="Enter your password" autocomplete="current-password"
                 class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" />
        </div>
      </div>

      <button type="submit" id="authSubmitBtn" 
              class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-xs font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30">
        Login to Dashboard
      </button>
    </form>

    <!-- Switch Between Student Login & Register -->
    <div id="studentToggleGroup" class="text-center text-xs text-slate-400 pt-1 border-t border-slate-800/80">
      <span id="switchPrompt">Don't have an account?</span>
      <button type="button" onclick="toggleRegisterMode()" id="switchBtn" class="text-indigo-400 font-semibold hover:underline ml-1">Create Account</button>
    </div>

    <!-- Switch Between Student & Admin Mode -->
    <div class="text-center pt-1">
      <button type="button" onclick="toggleAdminMode()" id="adminToggleBtn" 
              class="text-xs text-slate-400 hover:text-amber-400 transition flex items-center justify-center gap-1.5 mx-auto font-medium">
        <i id="adminToggleIcon" class="fa-solid fa-shield-halved text-amber-500"></i>
        <span id="adminToggleText">Go to Admin Portal</span>
      </button>
    </div>

  </div>

  <!-- Forgot Password / OTP Modal -->
  <div id="forgotModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-key text-indigo-400"></i> Reset Password
        </h3>
        <button onclick="closeForgotModal()" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div id="forgotAlert" class="hidden p-2.5 rounded-xl text-xs border"></div>

      <!-- Step 1: Send OTP -->
      <div id="otpStep1" class="space-y-3">
        <p class="text-xs text-slate-400">Enter your registered email to receive a 6-digit verification code.</p>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
          <input type="email" id="forgotEmail" placeholder="student@campus.edu" 
                 class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
        </div>
        <button onclick="sendOtp()" id="sendOtpBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2.5 rounded-xl transition">
          Send OTP Code
        </button>
      </div>

      <!-- Step 2: Verify & Reset -->
      <div id="otpStep2" class="hidden space-y-3">
        <p class="text-xs text-slate-400">Enter the OTP sent to your email along with your new password.</p>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Enter 6-Digit OTP</label>
          <input type="text" id="otpValue" placeholder="e.g. 482910" maxlength="6"
                 class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white tracking-widest font-mono text-center focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">New Password</label>
          <input type="password" id="newPassword" placeholder="Minimum 6 characters" 
                 class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
        </div>
        <button onclick="verifyAndResetPassword()" id="resetPwBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2.5 rounded-xl transition">
          Reset & Update Password
        </button>
      </div>
    </div>
  </div>

  <script>
    let isRegisterMode = false;
    let isAdminMode = false;

    function showAlert(msg, isError = true) {
      const alert = document.getElementById('authAlert');
      alert.classList.remove('hidden', 'bg-rose-950/60', 'border-rose-800', 'text-rose-300', 'bg-emerald-950/60', 'border-emerald-800', 'text-emerald-300');
      if (isError) {
        alert.classList.add('bg-rose-950/60', 'border-rose-800', 'text-rose-300');
        alert.innerHTML = `<i class="fa-solid fa-circle-exclamation text-rose-400"></i><span>${msg}</span>`;
      } else {
        alert.classList.add('bg-emerald-950/60', 'border-emerald-800', 'text-emerald-300');
        alert.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>${msg}</span>`;
      }
    }

    function toggleRegisterMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('authAlert').classList.add('hidden');
      
      const nameGroup = document.getElementById('nameFieldGroup');
      const submitBtn = document.getElementById('authSubmitBtn');
      const title = document.getElementById('portalTitle');
      const subtitle = document.getElementById('portalSubtitle');
      const switchPrompt = document.getElementById('switchPrompt');
      const switchBtn = document.getElementById('switchBtn');
      const forgotLink = document.getElementById('forgotPwLink');

      if (isRegisterMode) {
        nameGroup.classList.remove('hidden');
        title.innerText = 'Create Account';
        subtitle.innerText = 'Register your student profile to track coursework and tests';
        submitBtn.innerText = 'Create Account';
        switchPrompt.innerText = 'Already have an account?';
        switchBtn.innerText = 'Login';
        forgotLink.classList.add('hidden');
      } else {
        nameGroup.classList.add('hidden');
        title.innerText = 'Student Login';
        subtitle.innerText = 'Enter your university credentials to access your academic dashboard';
        submitBtn.innerText = 'Login to Dashboard';
        switchPrompt.innerText = "Don't have an account?";
        switchBtn.innerText = 'Create Account';
        forgotLink.classList.remove('hidden');
      }
    }

    function toggleAdminMode() {
      isAdminMode = !isAdminMode;
      document.getElementById('authAlert').classList.add('hidden');
      
      // Clear inputs
      document.getElementById('authEmail').value = '';
      document.getElementById('authPassword').value = '';
      document.getElementById('authFullName').value = '';

      const iconBg = document.getElementById('portalIconBg');
      const icon = document.getElementById('portalIcon');
      const title = document.getElementById('portalTitle');
      const subtitle = document.getElementById('portalSubtitle');
      const submitBtn = document.getElementById('authSubmitBtn');
      const studentToggle = document.getElementById('studentToggleGroup');
      const adminToggleText = document.getElementById('adminToggleText');
      const adminToggleIcon = document.getElementById('adminToggleIcon');
      const nameGroup = document.getElementById('nameFieldGroup');
      const emailInput = document.getElementById('authEmail');
      const pwInput = document.getElementById('authPassword');
      const forgotLink = document.getElementById('forgotPwLink');

      if (isAdminMode) {
        isRegisterMode = false;
        nameGroup.classList.add('hidden');
        studentToggle.classList.add('hidden');
        forgotLink.classList.add('hidden');

        iconBg.className = 'w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-amber-600 to-rose-600 flex items-center justify-center shadow-lg shadow-amber-500/30 transition-all duration-300';
        icon.className = 'fa-solid fa-shield-halved text-white text-2xl';
        title.innerText = 'Admin Portal';
        subtitle.innerText = 'Restricted Administrator Control Access';
        submitBtn.className = 'w-full bg-gradient-to-r from-amber-600 to-rose-600 hover:from-amber-500 hover:to-rose-500 text-white text-xs font-bold py-3 rounded-xl transition shadow-lg shadow-amber-600/30';
        submitBtn.innerText = 'Authenticate as Administrator';

        emailInput.placeholder = 'Enter Admin ID / Email';
        pwInput.placeholder = 'Enter Admin Password';

        adminToggleText.innerText = 'Switch to Student Login';
        adminToggleIcon.className = 'fa-solid fa-graduation-cap text-indigo-400';
      } else {
        studentToggle.classList.remove('hidden');
        forgotLink.classList.remove('hidden');

        iconBg.className = 'w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/30 transition-all duration-300';
        icon.className = 'fa-solid fa-graduation-cap text-white text-2xl';
        title.innerText = 'Student Login';
        subtitle.innerText = 'Enter your university credentials to access your academic dashboard';
        submitBtn.className = 'w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-xs font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30';
        submitBtn.innerText = 'Login to Dashboard';

        emailInput.placeholder = 'Enter your email address';
        pwInput.placeholder = 'Enter your password';

        adminToggleText.innerText = 'Go to Admin Portal';
        adminToggleIcon.className = 'fa-solid fa-shield-halved text-amber-500';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const fullName = document.getElementById('authFullName').value.trim();

      if (!email || !password || (isRegisterMode && !fullName)) {
        showAlert('Please fill in all required fields.');
        return;
      }

      const submitBtn = document.getElementById('authSubmitBtn');
      submitBtn.disabled = true;
      const originalText = submitBtn.innerText;
      submitBtn.innerText = 'Verifying credentials...';

      const endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
      const payload = isRegisterMode ? { email, password, full_name: fullName } : { email, password };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showAlert('Authenticated successfully! Redirecting...', false);
          setTimeout(() => {
            window.location.href = data.redirect || '/';
          }, 800);
        } else {
          showAlert(data.error || 'Authentication failed.');
        }
      } catch (err) {
        showAlert('Network or server error: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;
      }
    }

    // Modal Operations
    function openForgotModal() {
      document.getElementById('forgotModal').classList.remove('hidden');
      document.getElementById('otpStep1').classList.remove('hidden');
      document.getElementById('otpStep2').classList.add('hidden');
      document.getElementById('forgotAlert').classList.add('hidden');
    }

    function closeForgotModal() {
      document.getElementById('forgotModal').classList.add('hidden');
    }

    async function sendOtp() {
      const email = document.getElementById('forgotEmail').value.trim();
      if (!email) {
        alert('Please enter your email.');
        return;
      }
      const btn = document.getElementById('sendOtpBtn');
      btn.disabled = true;
      btn.innerText = 'Sending OTP...';

      try {
        const res = await fetch('/api/auth/forgot-password/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          document.getElementById('otpStep1').classList.add('hidden');
          document.getElementById('otpStep2').classList.remove('hidden');
          alert(`OTP sent successfully! Demo verification code: ${data.demo_otp}`);
        } else {
          alert(data.error || 'Failed to send OTP.');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Send OTP Code';
      }
    }

    async function verifyAndResetPassword() {
      const email = document.getElementById('forgotEmail').value.trim();
      const otp = document.getElementById('otpValue').value.trim();
      const new_password = document.getElementById('newPassword').value.trim();

      if (!otp || !new_password) {
        alert('Please enter both the OTP and your new password.');
        return;
      }

      const btn = document.getElementById('resetPwBtn');
      btn.disabled = true;
      btn.innerText = 'Updating password...';

      try {
        const res = await fetch('/api/auth/forgot-password/verify-and-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp, new_password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alert('Password reset successful! You can now log in.');
          closeForgotModal();
        } else {
          alert(data.error || 'Failed to reset password.');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Reset & Update Password';
      }
    }
  </script>
</body>
</html>
